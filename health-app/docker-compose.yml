services:
  backend:
    build:
      context: ./backend
    container_name: health-backend
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-health_user}:${POSTGRES_PASSWORD:-health_pass}@postgres:5432/${POSTGRES_DB:-health_app}?schema=public
      - JWT_SECRET=${JWT_SECRET:-fitters-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy

  miniapp:
    build:
      context: ./miniapp-vue3
    container_name: health-miniapp
    ports:
      - "${MINIAPP_PORT:-5174}:5174"
    environment:
      - VITE_API_BASE=http://localhost:${BACKEND_PORT:-18080}/api
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
    container_name: health-ai-service
    ports:
      - "${AI_SERVICE_PORT:-5000}:5000"

  postgres:
    image: postgres:16-alpine
    container_name: health-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=health_app
      - POSTGRES_USER=health_user
      - POSTGRES_PASSWORD=health_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
