services:
  backend:
    build:
      context: ./backend
    container_name: health-backend
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-health_user}:${POSTGRES_PASSWORD:-health_pass}@postgres:5432/${POSTGRES_DB:-health_app}?schema=public
      - JWT_SECRET=${JWT_SECRET:-fitters-dev-secret}
      - AI_SERVICE_URL=http://health-ai-service:5000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-fitters-ai-internal-secret}
    depends_on:
      postgres:
        condition: service_healthy

  miniapp:
    build:
      context: ./miniapp-vue3
    container_name: health-miniapp
    ports:
      - "${MINIAPP_PORT:-5174}:5174"
    environment:
      - VITE_API_BASE=http://localhost:${BACKEND_PORT:-18080}/api
    depends_on:
      - backend

  ai-service:
    build:
      context: ./ai-service
    container_name: health-ai-service
    ports:
      - "${AI_SERVICE_PORT:-5000}:5000"
    environment:
      - BACKEND_INTERNAL_URL=http://health-backend:8080
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-fitters-ai-internal-secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v4}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-90}
      - RAG_STORE_PATH=/app/data/fitness_rag.sqlite
    volumes:
      - ai_rag_data:/app/data

  postgres:
    image: postgres:16-alpine
    container_name: health-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=health_app
      - POSTGRES_USER=health_user
      - POSTGRES_PASSWORD=health_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aidlearning:
    build:
      context: ./study/aid_learning_agent
      dockerfile: Dockerfile.backend
      target: production
    container_name: health-aidlearning
    restart: unless-stopped
    ports:
      - "${AIDLEARNING_PORT:-8001}:8001"
    volumes:
      - ./study/aid_learning_agent/data/user:/app/data/user
      - ./study/aid_learning_agent/data/memory:/app/data/memory
      - ./study/aid_learning_agent/data/knowledge_bases:/app/data/knowledge_bases
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  ai_rag_data:
