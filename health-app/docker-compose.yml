services:
  backend:
    build:
      context: ./backend
    container_name: health-backend
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    command: >
      sh -c "
      set -a &&
      . /run/config/project.env &&
      set +a &&
      export DATABASE_URL=postgresql://$${POSTGRES_USER:-health_user}:$${POSTGRES_PASSWORD:-health_pass}@postgres:5432/$${POSTGRES_DB:-health_app}?schema=public &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run dev
      "
    volumes:
      - ./backend:/app
      - ./backend/package-lock.json:/app/package-lock.json:ro
      - ./.env:/run/config/project.env:ro
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/prisma/schema.prisma
          action: restart
        - path: ./.env
          action: restart

  miniapp:
    build:
      context: ./miniapp-vue3
    container_name: health-miniapp
    ports:
      - "${MINIAPP_PORT:-5174}:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    command: >
      sh -c "
      set -a &&
      . /run/config/project.env &&
      set +a &&
      export VITE_API_BASE=http://localhost:$${BACKEND_PORT:-18080}/api &&
      npm run dev:h5 -- --host 0.0.0.0 --port 5174
      "
    volumes:
      - ./miniapp-vue3:/app
      - ./miniapp-vue3/package-lock.json:/app/package-lock.json:ro
      - ./.env:/run/config/project.env:ro
      - miniapp_node_modules:/app/node_modules
    depends_on:
      - backend
    develop:
      watch:
        - path: ./.env
          action: restart

  ai-service:
    build:
      context: ./ai-service
    container_name: health-ai-service
    ports:
      - "${AI_SERVICE_PORT:-5000}:5000"
    environment:
      - FLASK_DEBUG=1
    command: >
      sh -c "
      set -a &&
      . /run/config/project.env &&
      set +a &&
      python -m flask --app app run --debug --host 0.0.0.0 --port 5000
      "
    volumes:
      - ./ai-service:/app
      - ./.env:/run/config/project.env:ro
    develop:
      watch:
        - path: ./.env
          action: restart

  postgres:
    image: postgres:16-alpine
    container_name: health-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-health_app}
      - POSTGRES_USER=${POSTGRES_USER:-health_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-health_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health_user} -d ${POSTGRES_DB:-health_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  backend_node_modules:
  miniapp_node_modules:
